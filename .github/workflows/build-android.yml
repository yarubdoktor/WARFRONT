name: Build WARFRONT Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Babylon_Warfront_Starter_v0.4.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ''

      - name: Extract WARFRONT source
        shell: bash
        run: |
          mkdir -p source
          unzip -q Babylon_Warfront_Starter_v0.4.zip -d source
          APP_DIR="$(find source -type f -name package.json -not -path '*/node_modules/*' -print -quit | xargs -r dirname)"
          if [ -z "$APP_DIR" ]; then
            echo "::error::No package.json found inside Babylon_Warfront_Starter_v0.4.zip"
            echo "Archive contents:"
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Found app at: $APP_DIR"

      - name: Install web dependencies and build
        shell: bash
        run: |
          cd "$APP_DIR"
          npm install
          node -e "const p=require('./package.json'); if(!p.scripts || !p.scripts.build) { console.error('package.json has no build script'); process.exit(1) }"
          npm run build -- --target esnext

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Add Capacitor Android wrapper
        shell: bash
        run: |
          cd "$APP_DIR"
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.js ]; then
            npx cap init WARFRONT com.yarubdoktor.warfront --web-dir dist
          fi
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        shell: bash
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WARFRONT-debug-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
